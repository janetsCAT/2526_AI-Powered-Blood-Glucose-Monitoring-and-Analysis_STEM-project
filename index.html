<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 血糖監測與分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0e27;
            --card: rgba(20, 25, 60, 0.95);
        }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27, #1a1f4d);
            color: #e0e7ff; line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card {
            background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
        }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 2.2rem; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; transition: all 0.2s;
        }
        .btn-primary { background: #4a9eff; color: white; }
        .btn-primary:hover { background: #3b8ae6; }
        .btn-secondary { background: #334155; color: #e0e7ff; }
        input, select, textarea {
            background: rgba(10,14,39,0.8); border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 8px; padding: 10px;
        }
        .chat-msg { margin: 12px 0; padding: 12px; border-radius: 12px; max-width: 80%; }
        .user-msg { background: #4a9eff; margin-left: auto; color: white; }
        .ai-msg { background: #1e2937; }
    </style>
</head>
<body>
<div class="container">

    <!-- 標題 -->
    <div class="header">
        <h1>🩸 AI 血糖監測與健康分析平台</h1>
        <p>即時數據 • 智能分析 • 個人化建議</p>
    </div>

    <!-- 第一區：即時血糖 -->
    <div class="card">
        <h2>📊 即時血糖</h2>
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
            <div>
                <div style="font-size:3.5rem; font-weight:bold;" id="currentGlucose"> -- </div>
                <div style="font-size:0.9rem; color:#94a3b8;">mg/dL</div>
            </div>
            <button class="btn btn-primary" onclick="getBloodGlucose()">🔄 刷新數據</button>
        </div>
        <canvas id="glucoseChart" height="120"></canvas>
    </div>

    <!-- 第二區：AI 血糖分析 -->
    <div class="card">
        <h2>🧠 AI 智能分析</h2>
        
        <!-- 控制列 -->
        <div style="display:flex; gap:8px; margin:15px 0; flex-wrap:wrap;">
            <select id="analysisType" style="flex:1; max-width:220px;">
                <option value="full">完整分析（血糖+飲食建議）</option>
                <option value="glucose">僅血糖分析</option>
                <option value="food">僅飲食推薦</option>
                <option value="urgent">緊急血糖建議</option>
            </select>
            <button class="btn btn-primary" onclick="runBlynkAI()" id="blynkAiBtn">▶ 一鍵分析</button>
            <button class="btn btn-secondary" onclick="clearBlynkChat()">🗑️ 清空對話</button>
        </div>

        <!-- 自訂問題輸入 -->
        <div style="display:flex; gap:8px; margin:12px 0; flex-wrap:wrap;">
            <input type="text" id="customQuestion" 
                   placeholder="輸入您的問題，例如：今天吃完飯後血糖升高怎麼辦？" 
                   style="flex:1;" 
                   onkeypress="if(event.key==='Enter') askBlynkAI()">
            <button class="btn btn-primary" onclick="askBlynkAI()">💬 送出問題</button>
        </div>

        <!-- API Key -->
        <div style="display:flex; gap:8px; margin-top:8px;">
            <input type="password" id="blynkAiKey" 
                   placeholder="豆包 API Key（留空使用示範模式）" 
                   style="flex:1;">
        </div>

        <!-- 聊天記錄 -->
        <div id="blynkChat" style="margin-top:20px; max-height:420px; overflow-y:auto; padding:10px; background:rgba(0,0,0,0.2); border-radius:12px;">
            <!-- 訊息由此動態新增 -->
        </div>
    </div>

</div>

<script>
// ==================== 配置區 ====================
const BLYNK_AUTH_TOKEN = '您的_BLYNK_TOKEN';   // ← 請替換
const BLYNK_SERVER = 'blynk.cloud';
const DOUBAO_API_KEY = '';   // 若填寫則優先使用，否則用輸入框
const DOUBAO_MODEL_ID = '您的接入點ID';   // ep-xxx
const DOUBAO_BASE_URL = 'https://ark.cn-beijing.volces.com/api/v3';

// ==================== Chart ====================
let glucoseChart;
function initChart() {
    const ctx = document.getElementById('glucoseChart');
    glucoseChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: '血糖 (mg/dL)', data: [], borderColor: '#4a9eff', tension: 0.4 }] },
        options: { responsive: true, scales: { y: { min: 50, max: 250 } } }
    });
}

// ==================== Blynk 功能 ====================
async function getBloodGlucose() {
    try {
        const res = await fetch(`https://${BLYNK_SERVER}/external/api/get?token=${BLYINK_AUTH_TOKEN}&V0`);
        const data = await res.json();
        const value = parseFloat(data[0]) || 0;
        document.getElementById('currentGlucose').textContent = value;
        
        // 更新圖表（示範用）
        const now = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
        glucoseChart.data.labels.push(now);
        glucoseChart.data.datasets[0].data.push(value);
        if (glucoseChart.data.labels.length > 20) {
            glucoseChart.data.labels.shift();
            glucoseChart.data.datasets[0].data.shift();
        }
        glucoseChart.update();
    } catch (e) {
        console.error(e);
        showToast('Blynk 讀取失敗，請檢查 Token', 'error');
    }
}

// ==================== AI 功能 ====================
async function callDoubao(prompt, onChunk = null) {
    const apiKey = document.getElementById('blynkAiKey').value.trim() || DOUBAO_API_KEY;
    if (!apiKey) {
        // 示範模式
        return new Promise(resolve => {
            setTimeout(() => resolve('（示範模式）根據目前血糖 ' + document.getElementById('currentGlucose').textContent + ' mg/dL，' + prompt), 800);
        });
    }
    const response = await fetch(`${DOUBAO_BASE_URL}/chat/completions`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
            model: DOUBAO_MODEL_ID,
            messages: [{ role: "system", content: "你是專業的血糖健康助手，請用溫和、實用的語氣回答。" }, { role: "user", content: prompt }],
            stream: !!onChunk
        })
    });

    if (!onChunk) {
        const data = await response.json();
        return data.choices[0].message.content;
    }
    // 串流處理（可自行擴展）
    return "串流回應已啟用（可自行擴展）";
}

function addBlynkMsg(role, content) {
    const chat = document.getElementById('blynkChat');
    const div = document.createElement('div');
    div.className = `chat-msg ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
    div.innerHTML = content;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function runBlynkAI() {
    const type = document.getElementById('analysisType').value;
    const glucose = document.getElementById('currentGlucose').textContent;
    let prompt = `當前血糖值為 ${glucose} mg/dL，請進行${type === 'full' ? '完整分析與飲食建議' : type === 'glucose' ? '血糖趨勢分析' : type === 'food' ? '飲食推薦' : '緊急建議'}。`;
    addBlynkMsg('user', `一鍵分析：${type}`);
    const result = await callDoubao(prompt);
    addBlynkMsg('ai', result);
}

async function askBlynkAI() {
    const input = document.getElementById('customQuestion');
    const q = input.value.trim();
    if (!q) return;
    addBlynkMsg('user', q);
    input.value = '';
    const result = await callDoubao(q);
    addBlynkMsg('ai', result);
}

function clearBlynkChat() {
    document.getElementById('blynkChat').innerHTML = '';
}

// ==================== 初始化 ====================
window.onload = () => {
    initChart();
    getBloodGlucose();           // 首次載入
    setInterval(getBloodGlucose, 15000);   // 每15秒自動刷新
    addBlynkMsg('ai', '歡迎使用 AI 血糖助手！請先確認 Blynk Token 已正確設定。');
};

// 簡單 Toast
function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2937;padding:12px 24px;border-radius:8px;color:white;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>

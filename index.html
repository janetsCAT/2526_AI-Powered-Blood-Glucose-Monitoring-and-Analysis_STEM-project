<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>血糖監測 + 飲食分析平台</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e27;
      --card: #1e2340;
      --border: rgba(255,255,255,0.08);
      --blue: #4facfe;
      --purple: #a855f7;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --teal: #06b6d4;
      --text: #e2e8f0;
      --sub: #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* （其餘樣式保持不變，為節省篇幅省略相同部分） */
    /* ... 原有所有 CSS 樣式 ... */

    /* 新增：自訂問題輸入樣式 */
    .custom-question {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .custom-question input {
      flex: 1;
      background: rgba(10,14,39,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 7px;
      padding: 8px 12px;
      color: white;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">🩸 血糖監測 + 🍽️ 飲食分析平台</div>
    <div class="nav-right">
      <div class="status">
        <span class="dot" id="connDot"></span>
        <span id="connText">未連接</span>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 第一區、第二區保持完全不變 -->
    <!-- ... （省略以避免重複，實際程式碼中保留您原有的第一、二區） ... -->

    <!-- 第三區：AI 分析血糖 + 推薦（已修改） -->
    <div class="card">
      <div class="section-title">🤖 AI 血糖分析 + 飲食建議</div>

      <!-- AI 平台選擇 -->
      <div class="platform-tabs">
        <button class="platform-tab active" onclick="setPlatform('deepseek')" id="tabDeepseek">🤖 DeepSeek</button>
        <button class="platform-tab" onclick="setPlatform('doubao')" id="tabDoubao">🔵 豆包</button>
        <button class="platform-tab" onclick="setPlatform('demo')" id="tabDemo">🔓 示範模式</button>
      </div>

      <!-- AI 對話區 -->
      <div id="blynkAiChat" class="ai-chat">
        <div class="msg ai">
          <div class="msg-label">AI 健康顧問</div>
          您好！我是您的血糖健康顧問。我可以根據您目前的血糖數據，提供個人化的飲食建議與健康分析。血糖數據會自動讀取，點擊「一鍵分析」即可獲得詳細建議。
        </div>
      </div>

      <!-- 控制列 -->
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <select id="analysisType" style="background:rgba(10,14,39,.8);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:7px 11px;color:white;font-size:12px">
          <option value="full">完整分析（血糖+飲食建議）</option>
          <option value="glucose">僅血糖分析</option>
          <option value="food">僅飲食推薦</option>
          <option value="urgent">緊急血糖建議</option>
        </select>
        <button class="btn btn-primary" onclick="runBlynkAI()" id="blynkAiBtn">▶ 一鍵分析</button>
        <button class="btn btn-secondary" onclick="clearBlynkChat()">🗑️ 清空對話</button>
      </div>

      <!-- 新增：自訂問題輸入框 -->
      <div class="custom-question">
        <input type="text" id="customQuestion" 
               placeholder="輸入您的問題，例如：今天吃完飯後血糖升高怎麼辦？" 
               onkeypress="if(event.key==='Enter') askBlynkAI()">
        <button class="btn btn-primary" onclick="askBlynkAI()">💬 送出問題</button>
      </div>

      <!-- API Key 設定 -->
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="password" id="blynkAiKey" placeholder="API Key（留空使用示範模式）" style="flex:1;background:rgba(10,14,39,.8);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:7px 11px;color:white;font-size:12px" />
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 全域變數（保持不變）
    let glucoseChart = null;
    let glucoseHistory = { time: [], values: [] };
    let blynkTimer = null;
    let blynkConnected = false;
    let foodImageBase64 = null;
    let timeIdx = 0;
    let currentGlucose = 0;
    let aiPlatform = 'deepseek';

    // ... （其餘所有原有函數保持不變：updateGlucoseStatus、initGlucoseChart、connectBlynk、startDemo、食物分析相關函數等）

    // 修改後的 askBlynkAI 函數
    async function askBlynkAI() {
      const questionInput = document.getElementById('customQuestion');
      const q = questionInput.value.trim();
      
      if (!q) {
        showToast('請輸入問題內容', 'error');
        return;
      }

      const apiKey = document.getElementById('blynkAiKey').value.trim();
      addBlynkMsg('user', q);

      // 清空輸入框
      questionInput.value = '';

      if (aiPlatform === 'demo' || !apiKey) {
        await simulateBlynkAI('full', q);
      } else if (aiPlatform === 'deepseek') {
        await callDeepSeekBlynk('full', apiKey, q);
      } else if (aiPlatform === 'doubao') {
        await callDoubaoBlynk('full', apiKey, q);
      }
    }

    // 其餘函數（runBlynkAI、simulateBlynkAI、callDeepSeekBlynk、callDoubaoBlynk 等）保持原樣
    // ...（請將您原有的這些函數完整複製到這裡）

    // 啟動
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => startDemo(), 500);
    });
  </script>
</body>
</html>
